server:
    address: 127.0.0.1
    port: 8080

spring:
    config:
        import: optional:file:.env[.properties]

    application:
        name: user-management

    datasource:
        url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/${MYSQL_DATABASE:user_management}
        username: ${MYSQL_USER:user_management}
        password: ${MYSQL_PASSWORD}
        hikari:
            connection-timeout: 10000

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate

    jackson:
        deserialization:
            fail-on-unknown-properties: true
        mapper:
            allow-coercion-of-scalars: false

logging:
    level:
        org.springframework.web: INFO
        org.hibernate.SQL: INFO
        # Driver errors can contain submitted values; advice emits sanitized diagnostics instead.
        org.hibernate.orm.jdbc.error: OFF
