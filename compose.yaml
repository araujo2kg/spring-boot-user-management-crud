services:
    mysql:
        image: mysql:8.4.8

        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
            MYSQL_DATABASE: ${MYSQL_DATABASE:-user_management}
            MYSQL_USER: ${MYSQL_USER:-user_management}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

        ports:
            - "127.0.0.1:${MYSQL_PORT:-3306}:3306"

        volumes:
            - mysql-data:/var/lib/mysql

        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP
                    -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE
                    -e 'SELECT 1' >/dev/null 2>&1
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

        restart: "no"

volumes:
    mysql-data:
